[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tocode-cli"
dynamic = ["version"]
description = "Export compiled binaries, IDA databases, Android APKs, and .NET assemblies as source-like projects for reverse engineering agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "buzzer-re" }]
keywords = [
  "reverse-engineering",
  "decompiler",
  "ida",
  "radare2",
  "angr",
  "binary-ninja",
  "android",
  "apk",
  "dex",
  "dotnet",
  "csharp",
  "il",
  "agents",
]
dependencies = [
  "droidasc==0.1.1.post1",
  "ida-domain==0.5.0",
  "idapro==0.0.9",
  "pythonnet==3.0.5 ; python_full_version < '3.11'",
  "pythonnet==3.2.0 ; python_full_version >= '3.11'",
  "r2pipe==1.9.8",
  "rpyc==6.0.2",
  "tqdm==4.67.3",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/buzzer-re/ToCode"
Repository = "https://github.com/buzzer-re/ToCode"
Issues = "https://github.com/buzzer-re/ToCode/issues"

[project.scripts]
tocode = "tocode.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]
angr = [
  "angr>=9.2",
]
# The Binary Ninja backend's headless client (rpyc) is a core runtime dependency
# above so `tocode --backend binja` works out of the box. The binaryninja module
# itself is provided by the Binary Ninja install (in-UI) or the remote VM via
# binja-headless, so it is intentionally not a pip dependency.

# angr is an optional backend dependency, so it may be absent from the type
# checking environment. Ignore its missing stubs/imports rather than failing.
[[tool.mypy.overrides]]
module = ["angr.*"]
ignore_missing_imports = true

# pyelftools (elftools) ships with the angr extra via cle, so it is likewise
# absent from the type checking environment. Ignore its missing imports.
[[tool.mypy.overrides]]
module = ["elftools.*"]
ignore_missing_imports = true

# binaryninja is supplied by the Binary Ninja install, so it is absent from the
# type checking environment. Ignore its missing imports.
[[tool.mypy.overrides]]
module = ["binaryninja.*"]
ignore_missing_imports = true

# droidasc (ASC, the APK backend) and androguard ship no type stubs.
[[tool.mypy.overrides]]
module = ["droidasc.*", "androguard.*"]
ignore_missing_imports = true

# The .NET backend imports CLR namespaces through pythonnet at runtime; they
# have no Python stubs.
[[tool.mypy.overrides]]
module = ["clr", "clr_loader.*", "pythonnet.*", "System", "System.*", "dnlib.*", "ICSharpCode.*"]
ignore_missing_imports = true

[tool.setuptools]
package-dir = { "" = "src" }

# Single source of truth for the version: src/tocode/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "tocode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
