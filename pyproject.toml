[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tocode-cli"
version = "0.1.0"
description = "Export compiled binaries as source-like projects for reverse engineering agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ida-domain==0.5.0",
  "idapro==0.0.9",
  "r2pipe==1.9.8",
  "tqdm==4.67.3",
]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]

[project.scripts]
tocode = "tocode.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]
angr = [
  "angr>=9.2",
]

# angr is an optional backend dependency, so it may be absent from the type
# checking environment. Ignore its missing stubs/imports rather than failing.
[[tool.mypy.overrides]]
module = ["angr.*"]
ignore_missing_imports = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
